name: marketplace-watch

on:
  schedule:
    # ~8am and ~8pm Europe/Paris. GitHub Actions cron is UTC and does not
    # follow DST, so these are CEST (UTC+2, summer) times. In winter (CET,
    # UTC+1) actual runs land an hour later than intended (9am/9pm). Adjust
    # by 1 hour around late Oct / late Mar if that drift matters to you.
    #
    # Scheduled at :17 rather than :00 — GitHub queues everyone's on-the-hour
    # cron jobs together and can delay them by hours under load; an off-peak
    # minute usually starts closer to the scheduled time.
    #
    # This repo was made public on 2026-07-28 specifically to fix repeated
    # 2+ hour scheduling delays (twice observed: 08:27 UTC for a 06:17
    # target, and the 18:17 evening run never firing on its own at all).
    # GitHub deprioritizes scheduled workflow triggers on PRIVATE repos on
    # the free tier — this is documented behavior, not a config bug, and
    # was the actual root cause. Public repos get full scheduling priority.
    # If this repo is ever made private again, expect the multi-hour delays
    # to come back.
    - cron: "17 6 * * *"
    - cron: "17 18 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" button in GitHub UI

permissions:
  contents: write   # needed to commit data/watcher.db back to the repo

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 run.py

      - name: Commit updated price history
        run: |
          git config user.name "marketplace-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/watcher.db
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update price history [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          git push
