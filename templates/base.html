<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>marketplace-watcher</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.4rem; }
  .card { border: 1px solid #8884; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .card.disabled { opacity: .55; }
  .card h2 { margin: 0 0 .25rem; font-size: 1.1rem; }
  .meta { color: #888; font-size: .85rem; margin-bottom: .5rem; }
  .actions { margin-top: .75rem; display: flex; gap: .5rem; }
  a.btn, button.btn { display: inline-block; padding: .4rem .9rem; border-radius: 6px; border: 1px solid #8884;
    background: transparent; text-decoration: none; color: inherit; cursor: pointer; font-size: .9rem; }
  a.btn.primary, button.btn.primary { background: #2563eb; color: white; border-color: #2563eb; }
  a.btn.danger, button.btn.danger { border-color: #dc2626; color: #dc2626; }
  form.field-group { display: flex; flex-direction: column; gap: .9rem; }
  label { font-weight: 600; font-size: .9rem; display: block; margin-bottom: .25rem; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: .5rem; border-radius: 6px; border: 1px solid #8886; font: inherit; box-sizing: border-box;
  }
  textarea { min-height: 4.5rem; font-family: ui-monospace, monospace; font-size: .85rem; }
  .hint { color: #888; font-size: .8rem; font-weight: normal; }
  .field-help { color: #888; font-size: .8rem; margin: .35rem 0 0; line-height: 1.4; }
  fieldset { border: 1px solid #8884; border-radius: 8px; padding: .75rem 1rem; }
  legend { font-weight: 600; font-size: .9rem; padding: 0 .4rem; }
  .checkbox-row { display: flex; align-items: center; gap: .5rem; margin: .35rem 0; }
  .checkbox-row input { width: auto; }
  .checkbox-row label { margin: 0; font-weight: normal; }
  .flash { padding: .6rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
  .flash.ok { background: #16a34a22; border: 1px solid #16a34a55; }
  .flash.err { background: #dc262622; border: 1px solid #dc262655; }
  .top-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
