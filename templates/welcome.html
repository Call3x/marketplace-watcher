<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>marketplace-watcher</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0a0a0f;
    color: #f5f5f7;
    font-family: -apple-system, system-ui, sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .greeting {
    font-size: clamp(2.2rem, 6vw, 4rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    opacity: 0;
    transform: translateY(12px);
    animation: rise 0.9s cubic-bezier(.16,1,.3,1) forwards;
  }
  .sub {
    margin-top: .75rem;
    font-size: 1rem;
    color: #8a8a94;
    opacity: 0;
    animation: rise 0.9s cubic-bezier(.16,1,.3,1) forwards;
    animation-delay: 0.35s;
  }
  .fade-out {
    animation: fadeOut 0.5s ease forwards !important;
  }
  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeOut {
    to { opacity: 0; }
  }
  body.leaving { animation: fadeOut 0.4s ease forwards; }
</style>
</head>
<body id="body">
  <div class="greeting">Hey {{ name }} 👋</div>
  <div class="sub">Checking your shopping list…</div>
  <script>
    setTimeout(() => {
      document.getElementById('body').classList.add('leaving');
      setTimeout(() => { window.location.href = '/'; }, 380);
    }, 1500);
  </script>
</body>
</html>
