{% extends "base.html" %}
{% block content %}
  <div class="top-actions">
    <h1>Run {{ 'finished' if ok else 'failed' }}</h1>
    <a class="btn" href="{{ url_for('index') }}">← Back to shopping list</a>
  </div>

  <div class="flash {{ 'ok' if ok else 'err' }}">
    {{ 'Run completed successfully.' if ok else 'Run finished with an error — see output below.' }}
  </div>

  <pre style="white-space: pre-wrap; background: #8881; border-radius: 8px; padding: 1rem; font-size: .85rem; overflow-x: auto;">{{ output }}</pre>
{% endblock %}
