# Shopping list config for marketplace-watcher.
# Each item defines what to search for, where, and the filters that decide
# whether a listing counts as a match worth notifying about.

settings:
  countries: [FR, LU, BE]     # Vinted/Leboncoin country scope
  run_budget_minutes: 15      # soft cap per run, adapters should respect this
  currency: EUR

items:
- id: xbox-series-x
  label: Xbox Series X
  category: electronics
  adapters:
  - vinted
  keywords:
  - xbox series x
  require_all_words:
  - xbox
  require_any_words: []
  exclude_keywords:
  - manette
  - controller
  - comando
  - mando
  - casque
  - volant
  - thrustmaster
  - logitech
  - gamesir
