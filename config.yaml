# Shopping list config for marketplace-watcher.
# Each item defines what to search for, where, and the filters that decide
# whether a listing counts as a match worth notifying about.

settings:
  countries: [FR, LU, BE]     # Vinted/Leboncoin country scope
  run_budget_minutes: 15      # soft cap per run, adapters should respect this
  currency: EUR

items:
- id: xbox-console
  label: Xbox Console (any generation)
  category: electronics
  adapters:
  - vinted
  keywords:
  - xbox one console
  - xbox one s
  - xbox one x
  - xbox series s console
  - xbox series x console
  require_all_words:
  - xbox
  # A real console listing almost always mentions its storage size or the
  # word "console" itself — games and accessories don't. This is the main
  # signal that separates consoles from games, not the exclude list below.
  require_any_words:
  - console
  - go
  - gb
  - tb
  - digital edition
  # Note: deliberately NOT excluding "manette"/"controller" here — a real
  # console bundle often says "with controllers included", and require_any_words
  # above already keeps controller-only listings out (they won't mention
  # console/gb/tb/digital edition). Excluding those words as substrings was
  # wrongly rejecting genuine console+controller bundles.
  exclude_keywords:
  - casque
  - volant
  - thrustmaster
  - logitech
  - gamesir
  - 8bitdo
  - geprint
  - houder
  - clip
  # Game-indicating words — this is now a backstop, not the primary filter
  # (require_any_words above does most of the work of excluding games).
  - jeu
  - jeux
  - juego
  - gioco
  - spiel
  - game
  - steelbook
  - blister
  - neuf sous blister
  price_min: 0
  price_max: 450
- id: watches-seiko-casio
  label: Seiko / Casio watches (date, day-date complications)
  category: watches
  adapters:
  - vinted
  keywords:
  - seiko
  - casio
  - orient
  - citizen
  - timex
  - tissot
  - certina
  - mondaine
  - polijot
  - lorus
  - alba
  - fossil
  require_any_words:
  - montre
  - watch
  - orologio
  - uhr
  - reloj
  - g-shock
  - gshock
  - relogio
  - relógio
  detail_keywords:
  - date
  - day-date
  - daydate
  - automatic
  - automatique
  - automatico
  exclude_keywords:
  - digital
  - montre connectée
  - smartwatch
  - réplique
  - fake
  - calculat
  - taschenrechner
  - rekenmachine
  - teclado
  - piano
  - fotocamera
  - graph 90
  - fx-8
  - fx 8
  - fx-9
  price_min: 0
  price_max: 100
- id: bmw-330i-f30-lci
  label: "BMW 330i F30 LCI (2017-2019)"
  category: cars
  adapters: [autoscout24]     # La Centrale / Leboncoin Auto blocked by DataDome, see README
  make: bmw
  model: "330i"
  body: f30
  year_min: 2017
  year_max: 2019
  lci_only: true              # facelift only, exclude pre-LCI F30
  price_min: 15000
  price_max: 19000
  mileage_max_km: 100000
  preferred_options: ["m sport", "pack m", "xdrive", "head-up", "toit ouvrant", "harman kardon"]
  exclude_keywords: ["accidenté", "salvage", "pour pièces", "non roulant"]
  enabled: true
